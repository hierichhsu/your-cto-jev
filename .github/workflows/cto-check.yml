# Reusable: run `cto check` on a pull request, so teammates who never installed cto get the same review.
# In your repo:
#
#   name: cto
#   on: [pull_request]
#   permissions: { contents: read }
#   jobs:
#     cto:
#       uses: hierichhsu/your-cto-jev/.github/workflows/cto-check.yml@main
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#
# Pass TYPESAFE_API_KEY or CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID instead, or several. With no key the job
# prints "could not check" and passes: cto fails open in CI exactly as it does on a laptop.
name: cto check

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY: { required: false }
      TYPESAFE_API_KEY: { required: false }
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the three-dot diff needs the merge base
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: npx -y your-cto-jev check --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CTO_NO_UPDATE_CHECK: '1'
